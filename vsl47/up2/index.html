<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gélatine Minceur Coréenne — Offre Spéciale</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<meta property="og:title" content="Gélatine Minceur Coréenne — Offre Spéciale">
<meta property="og:description" content="Arrêtez-vous ! Avertissement important.">
<meta name="robots" content="noindex, nofollow">

<style>
    :root {
        --color-bg: #ffffff;
        --color-bg-alt: #f8f9fa;
        --color-text: #1f2937;
        --color-text-muted: #6b7280;
        --color-border: #e5e7eb;
        --color-accent: #374151;
        --color-accent-hover: #1f2937;
        --color-success: #16a34a;
        --color-success-dark: #15803d;
        --color-warning: #dc2626;
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow-x: hidden; }
    body {
        font-family: var(--font-sans);
        background-color: var(--color-bg);
        color: var(--color-text);
        -webkit-font-smoothing: antialiased;
        line-height: 1.5;
    }

    img { max-width: 100%; height: auto; display: block; }

    /* Barre d'urgence */
    .urgency-bar {
        position: sticky;
        top: 0;
        z-index: 10;
        background-color: var(--color-warning);
        color: #ffffff;
        text-align: center;
        font-weight: 700;
        font-size: 14px;
        padding: 12px 16px;
    }
    .urgency-bar .highlight {
        color: #fde047;
    }

    main {
        max-width: 760px;
        margin: 0 auto;
        padding: 40px 16px 48px;
    }

    .warning-title {
        text-align: center;
        color: var(--color-warning);
        font-weight: 800;
        font-size: 22px;
        letter-spacing: 0.02em;
        margin-bottom: 24px;
        text-transform: uppercase;
    }
    @media (min-width: 640px) {
        .warning-title { font-size: 28px; }
    }

    .lead-text {
        max-width: 620px;
        margin: 0 auto 28px;
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        color: var(--color-text);
        padding: 0 4px;
    }
    @media (min-width: 640px) {
        .lead-text { font-size: 24px; }
    }
    .lead-text .accent {
        color: var(--color-success);
    }

    /* Vídeo (placeholder até o frame ser enviado) */
    .video-wrap {
        max-width: 400px;
        margin: 0 auto;
        width: 100%;
    }
    .video-placeholder {
        position: relative;
        width: 100%;
        padding-top: 178.21782178217822%; /* mesma proporção do vídeo principal */
        background-color: var(--color-bg-alt);
        border: 2px dashed var(--color-border);
        border-radius: 8px;
        overflow: hidden;
    }
    .video-placeholder-inner {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px;
        text-align: center;
        color: var(--color-text-muted);
    }
    .video-placeholder-icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background-color: var(--color-border);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .video-placeholder-icon svg { width: 22px; height: 22px; }
    .video-placeholder-text {
        font-size: 13px;
        font-weight: 600;
    }
</style>
</head>
<body>

<div class="urgency-bar">
    Seulement quelques personnes à <span class="highlight" id="city-name">votre région</span> ont été sélectionnées, ne manquez pas cette opportunité.
</div>

<main>

    <p class="warning-title">Arrêtez-vous ! Avertissement important !!!</p>

    <p class="lead-text">VOUS <span class="accent">N'AUREZ PLUS</span> CETTE OPPORTUNITÉ <span class="accent">SI VOUS FERMEZ</span> <span class="accent">CETTE PAGE !</span></p>

    <div class="video-wrap">
        <!--
            EMPLACEMENT DE LA VIDÉO (UP2)
            Remplacez ce bloc .video-placeholder par le code d'intégration
            du lecteur (ex. iframe VTurb / Converte.ai), en conservant si besoin
            l'aspect-ratio défini ci-dessus.
        -->
        <div class="video-placeholder">
            <div class="video-placeholder-inner">
                <div class="video-placeholder-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </div>
                <p class="video-placeholder-text">Vidéo à venir</p>
            </div>
        </div>
    </div>

</main>

<script>
    // Détection de la ville du visiteur via géolocalisation IP (service public, sans clé).
    fetch('https://ipwho.is/')
        .then(function (res) { return res.json(); })
        .then(function (data) {
            var cityEl = document.getElementById('city-name');
            if (cityEl && data && data.success !== false && data.city) {
                cityEl.textContent = data.city;
            }
        })
        .catch(function () {
            // En cas d'échec, le texte par défaut ("votre région") reste affiché.
        });
</script>

</body>
</html>
